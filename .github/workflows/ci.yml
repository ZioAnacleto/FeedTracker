name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Android Lint
        run: ./gradlew :composeApp:lintDebug :shared:lintDebug --stacktrace

      - name: Tests (server, JVM, Android)
        run: >
          ./gradlew
          :server:test
          :shared:jvmTest
          :shared:testDebugUnitTest
          :composeApp:jvmTest
          :composeApp:testDebugUnitTest
          --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/ktlint/**
            **/build/reports/lint-results*
          if-no-files-found: ignore

  test-ios:
    name: iOS tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests (iOS simulator)
        run: >
          ./gradlew
          :shared:iosSimulatorArm64Test
          :composeApp:iosSimulatorArm64Test
          --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore
