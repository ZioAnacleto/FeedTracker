name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  release-android:
    name: Android AAB
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Bundle release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :composeApp:bundleRelease
          -Pfeedtracker.versionCode=$VERSION_CODE
          -Pfeedtracker.versionName=$VERSION_NAME
          --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  release-desktop-linux:
    name: Desktop DEB
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package DEB
        run: >
          ./gradlew :composeApp:packageReleaseDeb
          -Pfeedtracker.versionCode=$VERSION_CODE
          -Pfeedtracker.versionName=$VERSION_NAME
          --stacktrace

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: composeApp/build/compose/binaries/**/*.deb
          if-no-files-found: error
          retention-days: 30

  release-desktop-windows:
    name: Desktop MSI
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package MSI
        run: >
          .\gradlew.bat :composeApp:packageReleaseMsi
          -Pfeedtracker.versionCode=$env:VERSION_CODE
          -Pfeedtracker.versionName=$env:VERSION_NAME
          --stacktrace

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: desktop-msi
          path: composeApp/build/compose/binaries/**/*.msi
          if-no-files-found: error
          retention-days: 30

  release-desktop-macos:
    name: Desktop DMG
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package DMG
        run: >
          ./gradlew :composeApp:packageReleaseDmg
          -Pfeedtracker.versionCode=$VERSION_CODE
          -Pfeedtracker.versionName=$VERSION_NAME
          --stacktrace

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: composeApp/build/compose/binaries/**/*.dmg
          if-no-files-found: error
          retention-days: 30
