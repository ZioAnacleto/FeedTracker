ktor {
    deployment {
        port = 8090
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ com.zioanacleto.feedtracker.ApplicationKt.module ]
    }
}

database {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://localhost:5433/feedtracker"
    url = ${?DATABASE_URL}
    user = "feedtracker"
    user = ${?DATABASE_USER}
    password = "feedtracker"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
}

auth {
    jwtSecret = "feedtracker-dev-jwt-secret-change-me!!"
    jwtSecret = ${?AUTH_JWT_SECRET}
    accessTokenTtlSeconds = 604800
    accessTokenTtlSeconds = ${?AUTH_ACCESS_TOKEN_TTL_SECONDS}
    registrationTokenTtlSeconds = 900
    registrationTokenTtlSeconds = ${?AUTH_REGISTRATION_TOKEN_TTL_SECONDS}
    verificationCodeTtlSeconds = 900
    verificationCodeTtlSeconds = ${?AUTH_VERIFICATION_CODE_TTL_SECONDS}
    verificationLinkBase = "feedtracker://auth/verify"
    verificationLinkBase = ${?AUTH_VERIFICATION_LINK_BASE}
    googleClientId = ""
    googleClientId = ${?GOOGLE_CLIENT_ID}
    appleAudience = ""
    appleAudience = ${?APPLE_AUDIENCE}
}

smtp {
    enabled = true
    enabled = ${?SMTP_ENABLED}
    host = "localhost"
    host = ${?SMTP_HOST}
    port = 1026
    port = ${?SMTP_PORT}
    username = ""
    username = ${?SMTP_USERNAME}
    password = ""
    password = ${?SMTP_PASSWORD}
    from = "noreply@feedtracker.local"
    from = ${?SMTP_FROM}
    startTls = false
    startTls = ${?SMTP_STARTTLS}
}
